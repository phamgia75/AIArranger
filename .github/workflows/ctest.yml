name: CTest

on:
  push:
    # claude/** : agent work branches are validated on macOS before any PR exists.
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Read-only token: the jobs only build and test.
permissions:
  contents: read

# A newer push to a PR supersedes its running check. Pushes to main get a
# unique group (run_id) so every merged commit keeps its full validation.
concurrency:
  group: ctest-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS: the full suite, including the CoreMIDI / CoreAudio platform layer.
    runs-on: macos-latest
    timeout-minutes: 30   # a hung test must not burn the 6 h default
    steps:
      - uses: actions/checkout@v4

      # Use the project's canonical test entry point so CI stays aligned with
      # local runs (cmake configure + build -j + ctest --output-on-failure).
      - name: Build + CTest (scripts/run_tests.sh)
        run: bash scripts/run_tests.sh

  macos-app:
    # BUILD_MACOS_APP=ON: the JUCE app must build, and its UI smoke test drives
    # the real LiveHostComponent (no MIDI device; AIARR_MIDI_HW_TX=0 via CTest).
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure (fetches JUCE 8.0.4)
        run: cmake -S . -B build-app -DBUILD_MACOS_APP=ON
      - name: Build app + smoke test
        run: cmake --build build-app -j4 --target aiarranger-macos aiarranger-app-smoke aiarranger-plugin-sampler
      - name: App UI smoke test
        env:
          AIARR_REQUIRE_REAL_PLUGIN: '1'   # the real DLSMusicDevice render must run, not SKIP
        run: ctest --test-dir build-app -R '^test_app_smoke$' -V --timeout 300   # -V: SKIP and timing lines stay visible

  ipados-simulator:
    # P2.6: the core cross-built for the iOS simulator, the Swift host tests run
    # inside a booted iPad simulator, then the app is installed, self-tests and
    # is sent to the background. No USB MIDI here: hardware stays pending.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (macOS native)
        run: bash apps/ipados/build.sh macos
      - name: Host tests + app in the iPad simulator
        run: bash apps/ipados/build.sh sim

  portable-core-linux:
    # Machine-checks the Gate 4 claim that the portable core (engine, facade,
    # C ABI bridge, importer, validation harness) builds and passes with no Apple
    # SDK, and runs it under sanitizers — the lock-free queues and cross-thread
    # facade are only race-checked here.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            flags: ""
          - name: asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          - name: tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer"
    name: portable-core-linux (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # TSan's shadow mapping breaks with the runner kernel's 32-bit mmap ASLR
      # entropy ("unexpected memory mapping"); 28 bits is the documented fix.
      - name: Reduce mmap ASLR entropy for TSan
        if: matrix.name == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DCMAKE_C_FLAGS="${{ matrix.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build
      - name: CTest
        run: ctest --test-dir build --output-on-failure --timeout 300
